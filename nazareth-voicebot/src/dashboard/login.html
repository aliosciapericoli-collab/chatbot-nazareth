<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050d14">
<title>{{TITOLO}}</title>
<link rel="icon" href="/dashboard/icona.svg" type="image/svg+xml">
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<style>
  @font-face {
    font-family: "Manrope";
    src: url("/dashboard/manrope.woff2") format("woff2");
    font-weight: 200 800;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --sfondo: #050d14; --carta: rgba(14, 30, 42, 0.78); --bordo: rgba(103, 232, 249, 0.16);
    --testo: #eef8fb; --testo-2: #a9c3cc; --accento: #22d3ee; --accento-2: #67e8f9; --accento-scuro: #0891b2;
    --accento-testo: #032730; --errore: #f87171;
    --aurora-1: rgba(34, 211, 238, 0.22); --aurora-2: rgba(14, 116, 144, 0.38);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --sfondo: #eef6f8; --carta: rgba(255, 255, 255, 0.86); --bordo: rgba(8, 145, 178, 0.18);
      --testo: #0b1f28; --testo-2: #3b5560; --accento: #0e7490; --accento-2: #0891b2; --accento-scuro: #155e75;
      --accento-testo: #ffffff; --errore: #dc2626;
      --aurora-1: rgba(34, 211, 238, 0.25); --aurora-2: rgba(14, 116, 144, 0.14);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 460px); place-content: center; align-items: center; padding: 24px 16px;
    background:
      radial-gradient(900px 520px at 50% -10%, var(--aurora-1), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, var(--aurora-2), transparent 60%),
      var(--sfondo);
    color: var(--testo); font: 16px/1.5 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .scheda {
    width: 100%; max-width: 460px; background: var(--carta); border: 1px solid var(--bordo); border-radius: 28px;
    padding: 36px 28px 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); text-align: center;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .marchio { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 -8px 18px; }
  .logo { width: 144px; height: 144px; flex: none; display: block; filter: drop-shadow(0 12px 34px rgba(34, 211, 238, 0.4)); }
  .onde { flex: 1 1 0; min-width: 0; max-width: 120px; height: 90px; }
  .onde.sinistra { transform: scaleX(-1); }
  @media (max-width: 420px) { .logo { width: 112px; height: 112px; } .scheda { padding: 28px 20px 22px; } }
  .onda-lato { transform-box: fill-box; transform-origin: center; animation: onda-lato 1.8s ease-in-out infinite; }
  @keyframes onda-lato { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1.1); } }
  .onda-logo { transform-box: fill-box; transform-origin: center; animation: onda 1.2s ease-in-out infinite; }
  @keyframes onda { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1.3); } }
  .nome { font-size: 36px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .cliente { color: var(--testo-2); font-size: 15px; font-weight: 600; margin: 8px 0 26px; }
  p { margin: 0 0 22px; color: var(--testo-2); font-size: 15px; }
  form { text-align: left; }
  label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  input { width: 100%; font: inherit; padding: 13px 15px; border-radius: 14px; border: 1px solid var(--bordo); background: rgba(127, 127, 127, 0.06); color: var(--testo); }
  input:focus { outline: 2px solid var(--accento); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 16px; font: inherit; font-weight: 800; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--accento-2), var(--accento-scuro)); color: var(--accento-testo);
    box-shadow: 0 10px 30px rgba(34, 211, 238, 0.28);
  }
  .errore { color: var(--errore); font-size: 14px; margin-top: 12px; min-height: 1em; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .onda-logo, .onda-lato { animation: none; } }
</style>
</head>

    <div class="nome">{{APP_NAME}}</div>
    <div class="cliente">{{CLIENT_NAME}}</div>
    <p>Accedi per vedere cosa è successo al telefono mentre la reception non c'era.</p>
    <form method="post" action="/dashboard/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entra</button>
      <div class="errore" role="alert">{{ERRORE}}</div>
    </form>

</html>
