<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1420">
<title>{{TITOLO}}</title>
<link rel="icon" href="/dashboard/icona.svg" type="image/svg+xml">
<link rel="manifest" href="/dashboard/manifest.webmanifest">
<style>
  :root {
    color-scheme: light;
    --sfondo: #f5f3ef; --carta: #ffffff; --bordo: #e4e0d8;
    --testo: #16181d; --testo-2: #5b5d63; --accento: #d9731f; --accento-testo: #ffffff; --errore: #c23434;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --sfondo: #0b0f18; --carta: #141a28; --bordo: #232b3d;
      --testo: #f3f4f7; --testo-2: #a7adbb; --accento: #f6a247; --accento-testo: #1a1206; --errore: #ff7a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(1200px 600px at 50% 115%, rgba(246, 162, 71, 0.18), transparent 60%), var(--sfondo);
    color: var(--testo); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .scheda { width: 100%; max-width: 380px; background: var(--carta); border: 1px solid var(--bordo); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12); }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo img { width: 48px; height: 48px; border-radius: 12px; }
  .logo b { display: block; font-size: 20px; letter-spacing: -0.01em; }
  .logo span { color: var(--testo-2); font-size: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--testo-2); font-size: 15px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--bordo); background: transparent; color: var(--testo); }
  input:focus { outline: 2px solid var(--accento); outline-offset: 1px; }
  button { width: 100%; margin-top: 16px; font: inherit; font-weight: 650; padding: 12px; border: 0; border-radius: 12px; background: var(--accento); color: var(--accento-testo); cursor: pointer; }
  .errore { color: var(--errore); font-size: 14px; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>
  <main class="scheda">
    <div class="logo">
      <img src="/dashboard/icona.svg" alt="">
      <div><b>{{APP_NAME}}</b><span>{{CLIENT_NAME}}</span></div>
    </div>
    <h1>Accedi</h1>
    <p>Accedi per vedere cosa è successo al telefono mentre la reception non c'era.</p>
    <form method="post" action="/dashboard/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entra</button>
      <div class="errore" role="alert">{{ERRORE}}</div>
    </form>
  </main>
</body>
</html>
